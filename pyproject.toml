[project]
name = "vm-platform"
version = "0.1.0"
description = "Self-Service application for VM Platform Management"
readme = "README.md"
authors = [
    { name = "Manivannan Manoharan", email = "manivannan83@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.150.0",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
